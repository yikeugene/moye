name: Windows build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      # Official actions, pinned to the reviewed release commits.
      # https://github.com/actions/checkout / setup-dotnet / upload-artifact
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        run: ./scripts/test.ps1 -Configuration Release
      - name: Check English UI layout
        run: ./scripts/preview-ui.ps1 -Configuration Release
      - name: Build Windows x64 installer
        run: ./scripts/publish-installer.ps1 -InstallCompiler
      - name: Verify installation and desktop shortcuts
        run: ./scripts/test-installer.ps1 -AllowDesktopChanges
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Moye-Setup-win-x64
          path: |
            artifacts/Moye-*-Setup-win-x64.exe
            artifacts/Moye-*-Setup-win-x64.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
